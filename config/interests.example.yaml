# Language for the full report (AI-written; "en", "zh", ...). The quick list is English.
language: "en"
vault_path: ""

daily:
  # Daily default: "full" = AI-written full report; "quick" = fast quick list.
  report_mode: "full"
  # Fetch budget, split across categories (100 over 4 categories = ~25 newest each).
  candidate_limit: 100
  recommendation_count: 10
  deep_analysis_count: 3
  skip_seen: true

sources:
  arxiv:
    # Also search arXiv by your keywords directly (helps thin-coverage fields).
    # Uses only the top ~10 keywords by domain priority; spans ALL of arXiv, so
    # keep keywords field-specific (generic terms pull in unrelated papers).
    keyword_search: true
    categories:
      - "cs.AI"
      - "cs.CL"
      - "cs.LG"
      - "cs.CV"

research_domains:
  "Agents":
    priority: 5
    keywords:
      - "agent"
      - "multi-agent"
      - "tool use"
      - "planning"
      - "workflow"
      - "autonomous"
    arxiv_categories:
      - "cs.AI"
      - "cs.CL"

  "Reasoning":
    priority: 4
    keywords:
      - "reasoning"
      - "chain-of-thought"
      - "verification"
      - "test-time compute"
      - "planning"
    arxiv_categories:
      - "cs.AI"
      - "cs.CL"
      - "cs.LG"

  "Multimodal":
    priority: 3
    keywords:
      - "multimodal"
      - "vision-language"
      - "VLM"
      - "image-text"
      - "visual grounding"
    arxiv_categories:
      - "cs.CV"
      - "cs.CL"
      - "cs.MM"

excluded_keywords:
  - "workshop"
